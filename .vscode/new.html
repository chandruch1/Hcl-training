
<!DOCTYPE html>

    <link rel="stylesheet" href="st.css">
</head>

<body>

    <div class="form-container">

        <form>
            <div class="form-row">
                <label>This is a very long label name</label>
                <input type="text" placeholder="Enter Your Name">
            </div>

            <div class="form-row">
                <label>Gender</label>

                <input type="radio" name="gender">
                <span>Male</span>

                <input type="radio" name="gender">
                <span>Female</span>
            </div>

            <div class="form-row">

                <input type="number">
            </div>

        </form>

    </div>

</body>
