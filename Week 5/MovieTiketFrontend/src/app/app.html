
<div class="container py-5">

  <div class="card shadow-sm mx-auto" style="max-width: 750px;">

    <div class="card-body p-4">

      <h2 class="text-primary mb-2">
        {{ title() }}
      </h2>

      <p class="text-muted">
        Backend API Connectivity Test
      </p>

      <hr>

      <p>
        <strong>Backend URL:</strong>
        http://localhost:5173
      </p>

      <p>
        <strong>Endpoint:</strong>
        GET /api/Movies
      </p>

      <button
        class="btn btn-primary"
        (click)="testConnection()"
        [disabled]="loading()">

        @if (loading()) {
          Testing connection...
        } @else {
          Test Backend Connection
        }

      </button>

      @if (response()) {
        <div class="alert alert-success mt-4">
          <h5>API Response Received</h5>

          <pre class="mb-0 text-wrap">{{ response() }}</pre>
        </div>
      }

      @if (errorMessage()) {
        <div class="alert alert-danger mt-4">
          <h5>Connection Failed</h5>
          {{ errorMessage() }}
        </div>
      }

    </div>

  </div>

</div>

<router-outlet />
