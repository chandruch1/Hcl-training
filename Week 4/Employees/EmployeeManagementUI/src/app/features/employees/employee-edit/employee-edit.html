
<div class="card shadow-sm">
  <div class="card-header">
    <h5 class="mb-0">Edit Employee</h5>
  </div>

  <div class="card-body">
    <form [formGroup]="editForm" (ngSubmit)="updateEmployee()">

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" formControlName="fullName">
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email">
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" formControlName="phone">
      </div>

      <div class="mb-3">
        <label class="form-label">Date Of Joining</label>
        <input type="date" class="form-control" formControlName="dateOfJoining">
      </div>

      <div class="mb-3">
        <label class="form-label">Salary</label>
        <input type="number" class="form-control" formControlName="salary">
      </div>

      <div class="mb-3">
        <label class="form-label">Department ID</label>
        <input type="number" class="form-control" formControlName="departmentId">
      </div>

      <div class="mb-3">
        <label class="form-label">Role</label>
        <select class="form-select" formControlName="role">
          <option [ngValue]="0">Employee</option>
          <option [ngValue]="1">Admin</option>
          <option [ngValue]="2">Manager</option>
        </select>
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input"
          id="isActive" formControlName="isActive">
        <label class="form-check-label" for="isActive">
          Active
        </label>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary"
          (click)="closeForm.emit()">
          Cancel
        </button>

        <button type="submit" class="btn btn-primary">
          Update Employee
        </button>
      </div>

    </form>
  </div>
</div>
